# Runs the test suite on every push and pull request to main.
#
# The suite includes tests that fail if a notebook in analysis/ carries cell
# outputs, a storage id or a credential, so participant text cannot reach the
# repository unnoticed.
#
# The install is ".[dev]" (reduce, cluster, viz; not embed). The embedding and
# naming stages need torch and a large model download, and no test uses them.
# Tests that compare against the study's stored outputs skip here, because those
# files are not in the repository: a green run is 373 passed, 16 skipped.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10". The upper bound is set
        # by umap-learn, which needs numba, which lags new Python releases.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show what was installed
        run: python -m pip list

      - name: Run the suite
        run: python -m pytest tests/ -q
